<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioExtract | Sonic Grinder</title>
    <meta name="description" content="Extract high-quality MP3 audio from your video files directly in your browser. Fast, secure, and fun.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- COI Service Worker for SharedArrayBuffer -->
    <script src="coi-serviceworker.js"></script>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <header>
            <h1 class="glitch" data-text="SONIC GRINDER">SONIC GRINDER</h1>
            <p class="subtitle">Extract audio with a touch of magic</p>
        </header>

        <div class="app-card">
            <!-- Drop Zone -->
            <div id="drop-zone" class="drop-zone">
                <div class="drop-zone-content">
                    <div class="icon-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-video"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
                    </div>
                    <h3>Drag & Drop Video</h3>
                    <p>MP4, MPG, or AVI</p>
                    <button id="browse-btn" type="button" class="btn-secondary">OR BROWSE FILES</button>
                    <input type="file" id="file-input" accept="video/*,.mpg,.mp4,.avi" class="visually-hidden">
                </div>
            </div>

            <!-- Processing View (Hidden by default) -->
            <div id="processing-view" class="processing-view hidden">
                <div class="grinder-container">
                    <div class="machine">
                        <div class="gear gear-1"></div>
                        <div class="gear gear-2"></div>
                        <div class="gear gear-3"></div>
                        <div class="file-path-line"></div>
                    </div>
                    <div class="waveform-output">
                        <div id="waveform" class="waveform">
                            <!-- Bars will be generated by JS -->
                        </div>
                    </div>
                </div>
                
                <div class="progress-info">
                    <div class="progress-header">
                        <span id="status-text">Processing...</span>
                        <span id="percentageText">0%</span>
                    </div>
                    <div class="progress-bar-container">
                        <div id="progress-bar" class="progress-bar"></div>
                    </div>
                    <div id="console-output" class="console-output"></div>
                </div>
            </div>

            <!-- Success View (Hidden by default) -->
            <div id="success-view" class="success-view hidden">
                <div class="success-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
                <h2>Extraction Complete!</h2>
                <p id="filename-display"></p>
                <div class="actions">
                    <a id="download-link" class="btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        DOWNLOAD MP3
                    </a>
                    <button id="reset-btn" class="btn-ghost">CONVERT ANOTHER</button>
                </div>
            </div>
        </div>

        <footer>
            <p>Processed entirely in your browser. No files are uploaded to any server.</p>
        </footer>
    </main>

    <!-- FFmpeg.wasm Scripts -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
